 name: Keep Supabase Alive on: schedule: - cron: '0 3 */3 * *' workflow_dispatch: {} jobs: ping: runs-on: ubuntu-latest steps: - name: Ping Supabase run: | curl -s -o /dev/null -w "%{http_code}" \ "$SUPABASE_URL/rest/v1/plans?select=id&limit=1" \ -H "apikey: $SUPABASE_ANON_KEY" env: SUPABASE_URL: ${{ secrets.SUPABASE_URL }} SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }} 
