name: Keep Supabase Alive
on:
  schedule:
    - cron: 0 3 */3 * *
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: curl -s -o /dev/null -w ...) dengan DUA baris ini sebagai gantinya: run: | curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/plans?select=id&limit=1" -H "apikey: $SUPABASE_ANON_KEY"
